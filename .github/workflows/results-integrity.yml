name: results-integrity

on:
  pull_request:
    paths:
      - "results/**"
      - "claims/**"
      - "docs/**"

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate results integrity
        run: python -m llmlab.cli validate --results results/
