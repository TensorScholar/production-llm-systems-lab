name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Mypy
        run: mypy src/llmlab
      - name: Pytest (unit, property, golden, integration)
        run: pytest -q
      - name: make a1 matches golden
        run: |
          make a1
          diff results/derived/A1/kv_table.csv tests/golden/a1_kv_table.csv
      - name: Fast demo-mock
        run: make demo-mock
      - name: llmlab validate
        run: python -m llmlab.cli validate --results results/
