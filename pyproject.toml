[project]
name = "llmlab"
version = "0.1.0.dev0"
description = "Production LLM Systems Lab: production-relevant measurement of LLM serving systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TensorScholar" }]

dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "aiohttp>=3.9",
  "matplotlib>=3.8",
  "huggingface_hub>=0.22",
  "prometheus_client>=0.20",
  "psutil>=5.9",
  "tabulate>=0.9",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.0"]
fast = ["uvloop>=0.19"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "pandas-stubs",
  "types-psutil",
]

[project.scripts]
llmlab = "llmlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "DTZ", "EM", "ICN", "PLC", "PLE", "PLW", "RUF"]
ignore = [
  "PLC0415", # deferred imports are deliberate for optional deps (huggingface_hub, pynvml, uvloop)
  "EM101", "EM102", # typed-exception call style used throughout library code
  "RUF002", # unicode math notation (−, ×, ḡ, λ) is deliberate in formula docstrings
]

[tool.ruff.lint.isort]
known-first-party = ["llmlab"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["llmlab.units", "llmlab.schemas", "llmlab.models", "llmlab.calc.*", "llmlab.metrics", "llmlab.analysis.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["llmlab"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
